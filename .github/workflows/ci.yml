name: FlowGuard CI Quality Gate

on:
  push:
    branches: [ develop, main, "feat/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Domain Boundary Isolation (Python)
        run: |
          python3 .agents/skills/flowguard/scripts/verify_boundaries.py .

      - name: Execute Automated Test Suite & Architecture Gate
        run: |
          ./mvnw clean test

      - name: Run FlowGuard Judge Court Conformance Audit
        run: |
          python3 .agents/skills/flowguard-judge/scripts/run_judge.py .

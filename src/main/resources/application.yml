spring:
  application:
    name: flowguard
  datasource:
    url: ${FLOWGUARD_DB_URL:jdbc:postgresql://localhost:5432/flowguard}
    username: ${FLOWGUARD_DB_USERNAME:flowguard}
    password: ${FLOWGUARD_DB_PASSWORD:flowguard}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

flowguard:
  max-payload-bytes: 262144 # 256 KiB
  worker:
    enabled: ${FLOWGUARD_WORKER_ENABLED:true}
    batch-size: 10
    lease-duration-seconds: 60
    poll-interval-ms: 1000
  retry:
    max-attempts: 5
    initial-delay-seconds: 5
    max-delay-seconds: 600
    multiplier: 2.0
    jitter-enabled: true
  idempotency:
    retention-days: 7
